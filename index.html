<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle</title>
<style>
  :root {
    --bg: #ffffff;
    --border: #d8d8d8;
    --lt-gray: #808080;
    --dark-border: #787c7e;
    --green: #538d4e;
    --yellow: #c9b458;
    --gray: #d8d8d8;
    --white: #ffffff;
    --black: #000000;
    --tile-size: min(11.5vw, 62px);
    --tile-gap: min(1.8vw, 5px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--black);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    user-select: none;
  }
  header {
    width: min(100%, 500px);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 0;
  }
  header h1 { margin: 0; font-size: 30px; letter-spacing: 2px; font-weight: 700; }
  header .date { font-size: 12px; color: var(--lt-gray); }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding-bottom: 20px;
    width: 100%;
  }
  #board {
    display: grid;
    grid-template-rows: repeat(6, var(--tile-size));
    grid-auto-flow: column;
    gap: var(--tile-gap);
  }
  .row { display: flex; gap: var(--tile-gap); }
  .tile {
    width: var(--tile-size);
    height: var(--tile-size);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--tile-size) * 0.55);
    font-weight: 700;
    text-transform: uppercase;
  }
  .tile.filled { border-color: var(--dark-border); animation: pop 0.1s ease; }
  .tile.flip { border-color: transparent; }
  .tile.flip.green { background-color: var(--green); color: var(--white); }
  .tile.flip.yellow { background-color: var(--yellow); color: var(--white); }
  .tile.flip.gray { background-color: var(--gray); color: var(--white); }
  .tile.shake { animation: shake 0.5s ease; }
  .tile.pop { animation: pop-win 0.5s ease; }
  .tile.flipping { animation: flip-in 0.5s ease; }
  #toast {
    min-height: 24px;
    background: var(--black);
    color: var(--white);
    font-size: 13px;
    font-weight: 600;
    padding: 0;
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #toast.show { opacity: 1; padding: 5px 12px; }
  .keyboard {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    max-width: 520px;
    padding: 0 6px;
  }
  .kb-row { display: flex; justify-content: center; gap: 5px; flex: 1; }
  .key {
    background: var(--gray);
    color: var(--black);
    border: none;
    border-radius: 3px;
    font-weight: 700;
    font-size: 14px;
    height: 100%;
    min-height: 54px;
    max-height: 58px;
    flex: 1;
    cursor: pointer;
    text-transform: uppercase;
    font-family: inherit;
  }
  .key.wide { flex: 1.6; font-size: 11px; }
  .key.green { background: var(--green); color: var(--white); }
  .key.yellow { background: var(--yellow); color: var(--white); }
  .key.gray { background: #3a3a3c; color: var(--white); }
  .key:active { transform: scale(0.95); }
  #banner {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
  }
  #banner.show { display: flex; }
  #banner .box {
    background: var(--white);
    border-radius: 8px;
    padding: 22px 30px;
    text-align: center;
    font-weight: 700;
    font-size: 18px;
    max-width: 320px;
    animation: pop 0.3s ease;
  }
  #banner .box div { color: var(--lt-gray); font-weight: 400; font-size: 14px; margin-top: 8px; }
  @keyframes flip-in { from { transform: rotateX(90deg); } to { transform: rotateX(0); } }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }
  @keyframes pop {
    0% { transform: scale(0.8); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  @keyframes pop-win {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
</style>
</head>

const ROWS = 6;
const COLS = 5;

// --- daily word selection: deterministic from the local date ---
function mulberry32(a) {
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function daySeed(date) {
  const start = Date.UTC(1970, 0, 1);
  const local = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
  return Math.floor((local - start) / 86400000);
}
function pickWord(date) {
  const rng = mulberry32(daySeed(date) * 2654435761 % 4294967296 || 1);
  const r = rng();
  return ANSWER_WORDS[Math.floor(r * ANSWER_WORDS.length)];
}

const today = new Date();
const word = pickWord(today);
document.getElementById("date-label").textContent =
  "Daily — " + today.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });

// --- state ---
let currentRow = 0;
let currentCol = 0;
let current = "";
let status = "playing"; // playing | won | lost
let revealing = false;

// --- build board ---
const boardEl = document.getElementById("board");
const tiles = []; // tiles[row][col]
for (let r = 0; r < ROWS; r++) {
  const row = document.createElement("div");
  row.className = "row";
  tiles[r] = [];
  for (let c = 0; c < COLS; c++) {
    const t = document.createElement("div");
    t.className = "tile";
    row.appendChild(t);
    tiles[r][c] = t;
  }
  boardEl.appendChild(row);
}

// --- build keyboard ---
const KEY_ROWS = [
  ["q","w","e","r","t","y","u","i","o","p"],
  ["a","s","d","f","g","h","j","k","l"],
  ["enter","z","x","c","v","b","n","m","back"]
];
const keyEls = {};
const kbEl = document.getElementById("keyboard");
for (const rowKeys of KEY_ROWS) {
  const rowEl = document.createElement("div");
  rowEl.className = "kb-row";
  for (const k of rowKeys) {
    const b = document.createElement("button");
    b.className = "key" + ((k === "enter" || k === "back") ? " wide" : "");
    b.textContent = k === "back" ? "⌫" : k === "enter" ? "ENTER" : k;
    b.addEventListener("click", () => onKey(k === "back" ? "Backspace" : k));
    rowEl.appendChild(b);
    keyEls[k] = b;
  }
  kbEl.appendChild(rowEl);
}

const keyState = {}; // letter -> 'green' | 'yellow' | 'gray'
function setKeyState(letter, state) {
  const rank = { gray: 0, yellow: 1, green: 2 };
  const cur = keyState[letter];
  if (!cur || rank[state] > rank[cur]) {
    keyState[letter] = state;
    keyEls[letter].className = "key " + state;
  }
}

// --- toast ---
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1500);
}

// --- input ---
function onKey(key) {
  if (status !== "playing" || revealing) return;
  if (key === "Enter") { submitGuess(); return; }
  if (key === "Backspace") {
    if (currentCol > 0) {
      currentCol--;
      const t = tiles[currentRow][currentCol];
      t.textContent = "";
      t.classList.remove("filled");
      current = current.slice(0, -1);
    }
    return;
  }
  if (/^[a-zA-Z]$/.test(key) && currentCol < COLS) {
    const letter = key.toLowerCase();
    tiles[currentRow][currentCol].textContent = letter;
    tiles[currentRow][currentCol].classList.add("filled");
    currentCol++;
    current += letter;
  }
}

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  onKey(e.key);
});

function shakeRow(row) {
  for (let c = 0; c < COLS; c++) {
    const t = tiles[row][c];
    t.classList.remove("shake");
    void t.offsetWidth;
    t.classList.add("shake");
    setTimeout(() => t.classList.remove("shake"), 600);
  }
}

function submitGuess() {
  if (current.length < COLS) {
    shakeRow(currentRow);
    toast("Not enough letters");
    return;
  }
  if (!ALLOWED_WORDS.includes(current)) {
    shakeRow(currentRow);
    toast("Not in word list");
    return;
  }
  const guess = current;
  current = "";
  revealRow(guess);
}

function evaluate(guess) {
  const result = new Array(COLS).fill("gray");
  const counts = {};
  for (const ch of word) counts[ch] = (counts[ch] || 0) + 1;
  for (let i = 0; i < COLS; i++) {
    if (guess[i] === word[i]) { result[i] = "green"; counts[guess[i]]--; }
  }
  for (let i = 0; i < COLS; i++) {
    if (result[i] === "green") continue;
    if (counts[guess[i]] > 0) { result[i] = "yellow"; counts[guess[i]]--; }
  }
  return result;
}

const WIN_PHRASES = ["Genius!", "Magnificent!", "Impressive!", "Splendid!", "Great!", "Phew!", "Almost!"];

function revealRow(guess) {
  revealing = true;
  const result = evaluate(guess);
  const row = currentRow;
  const letterOfKey = {};
  for (let c = 0; c < COLS; c++) {
    const state = result[c];
    setKeyState(guess[c], state);
    setTimeout(() => {
      const t = tiles[row][c];
      t.classList.add("flipping");
      setTimeout(() => t.classList.add("flip", state), 250);
      setTimeout(() => {
        t.classList.remove("flipping");
        if (status === "won" && row === currentRow) {
          t.classList.add("pop");
        }
      }, 500);
    }, c * 300);
  }
  setTimeout(() => {
    revealing = false;
    if (guess === word) {
      status = "won";
      showBanner(WIN_PHRASES[row] || "You won!", "The word was " + word);
    } else if (row + 1 === ROWS) {
      status = "lost";
      showBanner("The word was " + word, "Better luck tomorrow!");
    } else {
      currentRow++;
      currentCol = 0;
    }
  }, COLS * 300 + 600);
}

function showBanner(title, sub) {
  const b = document.getElementById("banner-content");
  b.innerHTML = "";
  const t = document.createElement("strong");
  t.textContent = title;
  b.appendChild(t);
  const d = document.createElement("div");
  d.textContent = sub;
  b.appendChild(d);
  const el = document.getElementById("banner");
  el.classList.add("show");
  el.onclick = () => el.classList.remove("show");
}
</script>
